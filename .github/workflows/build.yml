name: Build MeetingShot Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v0.4.1-fix
    paths:
      - "windows/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt
          pip install pyinstaller==6.10.0

      - name: Build EXE
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed --name MeetingShot windows/main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MeetingShot-Windows-v0.4.1
          path: dist/MeetingShot.exe
